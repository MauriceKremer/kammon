name: Release

on:
  push:
    tags: ["v*"]

# A release is one ordered run: verify, build every target, then publish. A
# second tag push cancels nothing; each tag gets its own run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

  build:
    needs: verify
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            pkgarch: arm64
          - goarch: arm
            goarm: "7"
            pkgarch: armv7
          - goarch: amd64
            goarm: ""
            pkgarch: amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: './go.mod'
          cache: true

      # The tag names the release (v0.7.0); the binaries and archives use the
      # version without the v (0.7.0), matching `kammon -version`.
      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kammon_${version}_linux_${{ matrix.pkgarch }}"
          mkdir -p "dist/${name}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "dist/${name}/kammon" ./cmd/kammon

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kammon_${version}_linux_${{ matrix.pkgarch }}"
          cp kammon.yml LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: kammon_${{ github.ref_name }}_linux_${{ matrix.pkgarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          # pattern matches artifact names, which carry no .tar.gz suffix
          pattern: kammon_*_linux_*
          path: dist
          merge-multiple: true

      # Prove the artifact, not just the build: the amd64 archive runs on this
      # runner, so unpack it and let the binary report its version (DST-11).
      - name: Smoke check the amd64 archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p smoke
          tar -C smoke -xzf "dist/kammon_${version}_linux_amd64.tar.gz"
          got="$(smoke/kammon_${version}_linux_amd64/kammon -version)"
          echo "$got"
          test "$got" = "kammon ${version} linux/amd64"

      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The matched pair relies on this statement: which KAM API contract this
      # KAMmon was built against (DST-13). Fail loudly if the pin is missing.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f docs/kam-api/KAM_COMMIT
          kam_base="$(sed -n 's/^base commit: //p' docs/kam-api/KAM_COMMIT)"
          kam_copy="$(sed -n 's/^copy: KAM @\([^ ]*\).*/\1/p' docs/kam-api/KAM_COMMIT)"
          test -n "$kam_base"
          test -n "$kam_copy"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > generated-notes.md
          {
            echo "Built against the KAM API contract: KAM @${kam_copy} (base commit ${kam_base})."
            echo
            cat generated-notes.md
          } > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/SHA256SUMS
